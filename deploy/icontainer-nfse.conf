# Proxy no Nginx do iContainer → Streamlit em 127.0.0.1:8501
# Instalar em:
#   /etc/icontainer/apps/nginx/nginx/conf/conf.d/nfse.conf
# Depois: docker exec ic-nginx-1yvo nginx -t && docker exec ic-nginx-1yvo nginx -s reload
#
# Acesse: http://IP_OU_HOST:8088  (porta dedicada para não conflitar com o site do painel)

server {
    listen 8088;
    server_name _;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
