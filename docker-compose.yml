# Deploy VPS — NFS-e (Streamlit) + PostgreSQL
#
# Nesta VPS o Nginx do iContainer já ocupa 80/443.
# Por isso este compose NÃO sobe Nginx: publica o app em :8501
# e o proxy do painel pode apontar para 127.0.0.1:8501.
#
# Uso:
#   cp deploy/env.vps.example .env
#   # edite .env
#   mkdir -p certificados data logs
#   docker compose up -d --build
#
# App direto: http://IP:8501
# Postgres: só na rede Docker (não exposto)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfse}
      POSTGRES_USER: ${POSTGRES_USER:-nfse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nfse} -d ${POSTGRES_DB:-nfse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rosafiscal

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8501"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nfse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nfse}
      RAILWAY_VOLUME_MOUNT_PATH: /app/data
    volumes:
      - appdata:/app/data
      - ./certificados:/app/certificados
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bind em todas as interfaces para acesso imediato; restrinja no firewall se quiser
      - "${APP_PORT:-8501}:8501"
    networks:
      - rosafiscal

  # Nginx embutido — use só em VPS SEM painel iContainer (profile)
  nginx:
    profiles: ["standalone-nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rosafiscal

volumes:
  pgdata:
  appdata:

networks:
  rosafiscal:
